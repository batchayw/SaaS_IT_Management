---
- name: Install and configure oVirt
  hosts: ovirt
  become: yes
  tasks:
    - name: Install oVirt engine
      yum:
        name: ovirt-engine
        state: present

    - name: Setup oVirt engine
      command: engine-setup --accept-defaults

    - name: Ensure oVirt service is running
      service:
        name: ovirt-engine
        state: started
        enabled: yes